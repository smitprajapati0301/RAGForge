name: RAGForge Evaluation

on:
  workflow_dispatch:

jobs:

  evaluate:

    name: RAG Evaluation

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # Checkout repository
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Python
      # ------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------
      # Install dependencies
      # ------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # ------------------------------------------
      # Verify RAGForge package
      # ------------------------------------------

      - name: Verify RAGForge package
        env:
          PYTHONPATH: .
        run: |
          python -c "from app.main import app; print('RAGForge package import OK')"

      # ------------------------------------------
      # Run RAG evaluation
      # ------------------------------------------

      - name: Run RAG evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/evaluate_rag.py

      # ------------------------------------------
      # Check evaluation quality
      # ------------------------------------------

      - name: Check evaluation quality
        env:
          PYTHONPATH: .
        run: |
          python scripts/check_evaluation.py