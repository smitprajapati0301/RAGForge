# ==========================================
# RAGForge Configuration
# ==========================================

project:
  name: RAGForge
  version: 1.0.0

# ------------------------------------------
# Server Configuration
# ------------------------------------------
server:
  host: "0.0.0.0"
  port: 8000

# ------------------------------------------
# Document Preprocessing
# ------------------------------------------
preprocessing:
  chunk_size: 100
  chunk_overlap: 20

# ------------------------------------------
# Embedding Model
# ------------------------------------------
embedding:
  model_name: "BAAI/bge-base-en-v1.5"
  normalize_embeddings: true
  batch_size: 32

# ------------------------------------------
# Vector Database
# ------------------------------------------
vector_db:
  provider: "chroma"
  collection_name: "ragforge"
  persist_directory: "./chroma_db"

# ------------------------------------------
# Retrieval
# ------------------------------------------
retrieval:
  top_k: 10

  hybrid:
    enabled: true
    semantic_top_k: 10
    bm25_top_k: 10
    rrf_k: 60

# ------------------------------------------
# Re-Ranking (Phase 7)
# ------------------------------------------
reranking:
  enabled: true
  top_k: 5
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# ------------------------------------------
# LLM (Phase 8)
# ------------------------------------------
llm:
  provider: "groq"
  model_name: "llama-3.3-70b-versatile"
  temperature: 0.2
  max_tokens: 1024

# ------------------------------------------
# Evaluation (Phase 9)
# ------------------------------------------
evaluation:
  enabled: true